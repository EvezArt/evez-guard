name: Agent Guard CI
on:
  pull_request:
    paths:
      - "agent_guard/**"
      - "tests/test_agent_guard.py"
      - ".github/workflows/agent-guard-ci.yml"
  push:
    branches: [main]
    paths:
      - "agent_guard/**"
      - "tests/test_agent_guard.py"
      - ".github/workflows/agent-guard-ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free policy tests
        run: python -m unittest discover -s tests -v
